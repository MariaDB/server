name: npm-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init extra/wolfssl/wolfssl libmariadb

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Node.js
        # Node 24 bundles npm >= 11.5.1, required for OIDC trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build WASM package
        run: ./wasm/build.sh

      - name: Test
        run: npm test
        working-directory: wasm

      - name: Publish to npm
        # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
        # The trusted publisher shyim/lite4mariadb + npm-publish.yml must be
        # configured in the package settings on npmjs.com. Provenance
        # attestations are added automatically. Skip gracefully if this
        # version was already published (e.g. a manual release).
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lite4mariadb@$VERSION" version >/dev/null 2>&1; then
            echo "lite4mariadb@$VERSION already published, skipping"
          else
            npm publish
          fi
        working-directory: wasm
