name: Build on Windows ARM64

on:
  push:
    branches:
      - 'main'
      - 'bb-*'
      - '[0-9]+.[0-9]+'
      - '*wlad*'
  pull_request:

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    runs-on: windows-11-arm

    steps:
      - name: Configure git
        run: |
          # We won't be able to successfully run mtr
          # unless we configure autocrlf.
          git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: System info
        run: |
          Write-Host "== Volumes"
          Get-Volume | Where-Object DriveLetter |
            Select-Object DriveLetter, FileSystemType, @{n='SizeGB';e={[int]($_.Size/1GB)}}, @{n='FreeGB';e={[int]($_.SizeRemaining/1GB)}} |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host "== Directories"
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          Write-Host "TEMP=$env:TEMP"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "== OS / CPU / memory"
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host ("{0} {1} ({2})" -f $os.Caption, $os.Version, $os.OSArchitecture)
          Write-Host ("Logical CPUs: {0}" -f $cs.NumberOfLogicalProcessors)
          Write-Host ("RAM: {0:N1} GB total, {1:N1} GB free" -f ($os.TotalVisibleMemorySize/1MB), ($os.FreePhysicalMemory/1MB))
          Write-Host ("Commit limit: {0:N1} GB, free virtual: {1:N1} GB" -f ($os.TotalVirtualMemorySize/1MB), ($os.FreeVirtualMemory/1MB))

      - name: Get cache key
        id: week
        # Refresh weekly, so the cached bison does not get stale.
        run: echo "id=$(Get-Date -UFormat '%G-W%V')" >> $env:GITHUB_OUTPUT

      - name: Restore winflexbison
        id: wfb
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\winflexbison3
            C:\ProgramData\chocolatey\bin\win_bison.exe
            C:\ProgramData\chocolatey\bin\win_flex.exe
          key: winflexbison3-${{ steps.week.outputs.id }}
          # Fall back to an older week's copy if choco is down.
          restore-keys: winflexbison3-

      - name: Install prerequisites
        id: choco
        if: steps.wfb.outputs.cache-hit != 'true'
        run: |
          # Install bison to compile. Retry, and tolerate choco being down
          # if an older cached copy was restored.
          for ($i = 1; $i -le 3; $i++) {
            choco upgrade winflexbison3 -y --no-progress
            if ($LASTEXITCODE -eq 0) {
              echo "fresh=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            Start-Sleep -Seconds (15 * $i)
          }
          if (Test-Path C:\ProgramData\chocolatey\bin\win_bison.exe) {
            Write-Warning "choco failed, using the previously cached winflexbison3"
            exit 0
          }
          exit 1

      - name: Build
        run: |
          # speedup checkout by excluding uninteresting modules
          git config submodule.storage/columnstore/columnstore.update none
          git config submodule.storage/maria/libmarias3.update none
          git config submodule.storage/rocksdb/rocksdb.update none
          git config submodule.wsrep-lib.update none
          mkdir bld
          cd bld
          cmake .. -DWITH_SSL=bundled
          cmake --build . --config RelWithDebinfo --verbose -- -m

      # A successful build proves bison works; save before the slow tests.
      - name: Save winflexbison
        if: success() && steps.choco.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\winflexbison3
            C:\ProgramData\chocolatey\bin\win_bison.exe
            C:\ProgramData\chocolatey\bin\win_flex.exe
          key: winflexbison3-${{ steps.week.outputs.id }}

      - name: Test MTR
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;$env:PATH;C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64"
          $parallel = 2
          # create case-sensitive directory to run tests in
          $cidir = "$env:RUNNER_TEMP/ci" -replace '\\','/'
          mkdir $cidir
          fsutil file setCaseSensitiveInfo $cidir enable
          perl bld\mysql-test\mysql-test-run.pl --force --parallel=$parallel --suite=main,innodb,parts --vardir=$cidir/var --skip-rpl --mysqld=--lower-case-table-names=0  --mysqld=--loose-innodb-flush-log-at-trx-commit=2 --mysqld=--debug-no-sync --skip-test=innodb-virtual-columns