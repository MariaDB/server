name: Run additional MTR suites on Windows

on:
  push:
    branches:
      - 'main'
      - 'bb-*'
      - '[0-9]+.[0-9]+'
      - '*wlad*'
      - '*elenst*'
  pull_request:

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    runs-on: windows-2025

    steps:

      - name: Collect system information
        shell: pwsh
        run: |
          $cs   = Get-CimInstance Win32_ComputerSystem
          $cpus = Get-CimInstance Win32_Processor
          $os   = Get-CimInstance Win32_OperatingSystem

          Write-Host "=== CPU ==="
          $cpus | ForEach-Object {
            Write-Host ("{0} | cores: {1} | logical processors: {2}" -f $_.Name.Trim(), $_.NumberOfCores, $_.NumberOfLogicalProcessors)
          }
          Write-Host ("Total logical processors: {0}" -f $cs.NumberOfLogicalProcessors)

          Write-Host "`n=== Memory ==="
          Write-Host ("Total physical: {0:N2} GB" -f ($cs.TotalPhysicalMemory / 1GB))
          Write-Host ("Free physical:  {0:N2} GB" -f ($os.FreePhysicalMemory * 1KB / 1GB))

          Write-Host "`n=== Disks ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID, VolumeName,
              @{n='Size(GB)'; e={[math]::Round($_.Size / 1GB, 2)}},
              @{n='Free(GB)'; e={[math]::Round($_.FreeSpace / 1GB, 2)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Configure git
        run: |
          # We won't be able to successfully run mtr
          # unless we configure autocrlf.
          git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          # Install bison to compile
          choco install winflexbison3

      - name: Build
        run: |
          # speedup checkout by excluding uninteresting modules
          git config submodule.storage/columnstore/columnstore.update none
          git config submodule.storage/maria/libmarias3.update none
          git config submodule.storage/rocksdb/rocksdb.update none
          git config submodule.wsrep-lib.update none
          mkdir bld
          cd bld
          cmake .. -DWITH_SSL=bundled
          cmake --build . --config Debug --verbose -- -m

      - name: Test MTR
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;$env:PATH;C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
          $parallel = 4
          # create case-sensitive directory to run tests in
          $tmp = (Get-Item $env:TEMP).FullName
          $tmp = $tmp -replace '\\','/'
          $cidir = "$tmp/ci"
          mkdir $cidir
          fsutil file setCaseSensitiveInfo $cidir enable
          perl bld\mysql-test\mysql-test-run.pl --force --max-test-fail=0 --big --parallel=$parallel --suite=rpl --vardir=$cidir/var --verbose-restart --retry=2